spring:
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:A12345*}
    database: 0
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 20       # 最大连接数，建议小于 200
        max-idle: 10        # 最大空闲连接
        min-idle: 5         # 最小空闲连接
        max-wait: 3000ms    # 最大阻塞等待时间，禁止使用默认值 -1
      shutdown-timeout: 100ms

